name: Fork source audit
on:
  push:
    branches: [work/evidence-first-company]
    paths: ['.github/workflows/fork-source-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive tracked public source only
        run: |
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/paperclip-source.tar.gz"
          sha256sum "$RUNNER_TEMP/paperclip-source.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paperclip-source
          path: ${{ runner.temp }}/paperclip-source.tar.gz
          retention-days: 1
          if-no-files-found: error
