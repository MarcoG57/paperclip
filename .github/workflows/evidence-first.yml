name: Evidence-first company
on:
  push:
    branches: [master, work/evidence-first-company]
    paths:
      - 'company/**'
      - 'scripts/company/**'
      - 'tests/company/**'
      - 'packages/teams-catalog/**'
      - 'packages/adapters/codex-local/**'
      - 'packages/shared/src/**/teams-catalog.ts'
      - 'server/src/services/teams-catalog.ts'
      - 'server/src/__tests__/teams-catalog-*.test.ts'
      - 'cli/src/commands/client/teams.ts'
      - '.github/workflows/evidence-first.yml'
      - 'pnpm-lock.yaml'
  pull_request:
    paths:
      - 'company/**'
      - 'scripts/company/**'
      - 'tests/company/**'
      - 'packages/teams-catalog/**'
      - 'packages/adapters/codex-local/**'
      - 'packages/shared/src/**/teams-catalog.ts'
      - 'server/src/services/teams-catalog.ts'
      - 'server/src/__tests__/teams-catalog-*.test.ts'
      - 'cli/src/commands/client/teams.ts'
      - '.github/workflows/evidence-first.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evidence-first-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  authoring-and-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '24.11.0'
          package-manager-cache: false
      - name: Generated source drift
        run: node scripts/company/generate.mjs --check
      - name: Node contracts and adversarial fixtures (no providers)
        run: node --test tests/company/*.test.mjs
      - name: Process lifecycle and exact ledger arithmetic
        run: python3 -m unittest discover -s tests/company -p 'test_*.py' -v
      - name: Working tree hygiene
        run: |
          git diff --check
          git diff --exit-code
  native-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PAPERCLIP_REQUIRE_EMBEDDED_TESTS: '1'
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: '24.11.0'
          package-manager-cache: false
      - name: Install locked workspace (no account or model keys)
        run: |
          npm install --global pnpm@9.15.4 --ignore-scripts
          pnpm install --frozen-lockfile
          pnpm run preflight:workspace-links
      - name: Native catalog consistency and tests
        run: |
          pnpm --filter @paperclipai/teams-catalog build:manifest
          git diff --exit-code -- packages/teams-catalog/generated/catalog.json
          pnpm --filter @paperclipai/teams-catalog validate
          pnpm --filter @paperclipai/teams-catalog test
      - name: Adapter, UI defaults, routes and real PostgreSQL import
        run: |
          pnpm exec vitest run packages/adapters/codex-local/src/index.test.ts packages/adapters/codex-local/src/server/codex-args.test.ts server/src/__tests__/teams-catalog-service.test.ts server/src/__tests__/teams-catalog-install-no-overrides.test.ts server/src/__tests__/teams-catalog-routes.test.ts ui/src/lib/new-agent-runtime-config.test.ts --maxWorkers=1
      - name: Typecheck changed packages
        run: pnpm --filter @paperclipai/shared --filter @paperclipai/teams-catalog --filter @paperclipai/adapter-codex-local --filter @paperclipai/server --filter paperclipai typecheck
